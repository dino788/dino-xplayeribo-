name: Build Dinho Player APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Python Dependencies
        run: pip install pillow

      - name: Download Apktool & Uber Apk Signer
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
          wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O uber-apk-signer.jar

      - name: Run Patch Script
        run: python3 patch_dinho.py

      - name: Sign APK
        run: |
          java -jar uber-apk-signer.jar -a dinho_unsigned.apk --out dist/

      - name: Upload Dinho Player APK
        uses: actions/upload-artifact@v4
        with:
          name: Dinho-Player-VIP
          path: dist/*.apk
